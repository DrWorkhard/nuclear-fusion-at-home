[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fusion-baselines"
version = "0.1.0"
description = "Reproducible stellarator baseline and evidence tooling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
[tool.hatch.build.targets.wheel]
packages = ["src/fusion_baselines", "src/fusion_public"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["artifacts", "environments", "external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
