description: "LPQA engineering-feasibility screening v1.1: refined-clearance safety margin, order 4, augmented Lagrangian."
surface_params:
  surface: "input.LandremanPaul2021_QA"
  range: "half period"

coils_params:
  ncoils: 4
  order: 4

optimizer_params:
  algorithm: "augmented_lagrangian"
  # Pinned implementation: inner SciPy iteration cap.
  max_iterations: 100
  # Pinned implementation: outer augmented-Lagrangian cap; k=1,...,9.
  max_iter_subopt: 10
  verbose: true

coil_objective_terms:
  total_length: "l2_threshold"
  coil_curvature: "lp_threshold"
  coil_curvature_p: 2
  coil_mean_squared_curvature: "l2_threshold"
  coil_arclength_variation: "l2_threshold"
  linking_number: ""
  flux_threshold: 1.0e-8
  length_threshold: 220.0
  # Same predeclared 40 mm reactor-scale safety margin as the paired run.
  cc_threshold: 1.1
  cs_threshold: 1.3
  curvature_threshold: 1.0
  msc_threshold: 1.0
  arclength_variation_threshold: 1.0
