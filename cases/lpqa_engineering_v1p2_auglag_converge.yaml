description: "LPQA engineering-feasibility v1.2: refined-clearance buffer and extended augmented-Lagrangian convergence run."
surface_params:
  surface: "input.LandremanPaul2021_QA"
  range: "half period"

coils_params:
  ncoils: 4
  order: 4

optimizer_params:
  algorithm: "augmented_lagrangian"
  # Pinned implementation: inner SciPy iteration cap.
  max_iterations: 100
  # Pinned implementation: outer loop executes k=1,...,19.
  max_iter_subopt: 20
  verbose: true

coil_objective_terms:
  total_length: "l2_threshold"
  coil_curvature: "lp_threshold"
  coil_curvature_p: 2
  coil_mean_squared_curvature: "l2_threshold"
  coil_arclength_variation: "l2_threshold"
  linking_number: ""
  flux_threshold: 1.0e-8
  length_threshold: 220.0
  # Optimization buffer; physical holdout acceptance remains the benchmark's
  # finite-build-derived 1.06 m minimum centerline distance.
  cc_threshold: 1.1
  cs_threshold: 1.3
  curvature_threshold: 1.0
  msc_threshold: 1.0
  arclength_variation_threshold: 1.0
